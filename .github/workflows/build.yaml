name: Build and Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        # 🟢 关键点 2：使用 'npm ci' 而不是 'npm install'
        # 'npm ci' 是专门为 CI 设计的（Clean Install），它会直接读取 package-lock.json
        # 速度更快，且能避免因 node_modules 缓存锁死导致的 EBUSY/EPERM 错误
        run: npm ci

      - name: Rebuild Native Modules
        shell: bash
        run: |
          npm run rebuild -- --force
        env:
          npm_config_runtime: electron
          npm_config_target: 40.0.0
          npm_config_disturl: https://electronjs.org/headers

      - name: Make (Build & Package)
        run: npm run make
        env:
          # 从 GitHub Secrets 注入激活服务器地址，打包时会写入产物
          ACTIVATION_SERVER_URL: ${{ secrets.ACTIVATION_SERVER_URL }}

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.rpm
            dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
